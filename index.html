<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">  
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <h1>Rock, Papers and Scissors</h1>
     <button class="simple-button js-rock-button">Rock</button>
     <button class="simple-button js-paper-button">Paper</button>
     <button class="simple-button js-scissors-button">Scissors</button>
     <button class="simple-button"  onclick="resetscore()">Reset Score</button>
     <button class="simple-button" onclick="playagain()">Autoplay</button>
     <p class="display_result" onclick="showresult(result);"></p>
     <p class="display_moves" onclick="showmoves(computermove,playermove);"></p>
     <p class="display_score" onclick="showscore();"></p>
     <script src="index.js"></script>
  </body>
</html>
